<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balaton Hills Golf Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b130f;       /* Deep forest black */
            --accent-gold: #c5a880;   /* Muted gold */
            --text-light: #f4f4f4;    /* Off-white */
            --text-muted: #8a958f;    /* Soft grey-green */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .logo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: var(--accent-gold);
            margin-top: 10px;
            font-weight: 400;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: var(--accent-gold);
            margin: 40px auto;
            opacity: 0.5;
        }

        .status {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            font-weight: 300;
        }

        @media (max-width: 480px) {
            .logo-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <div class="logo-title">Balaton Hills</div>
            <div class="logo-subtitle">Golf Club</div>
        </div>

        <div class="divider"></div>

        <div class="status">Under Construction</div>
    </div>

</body>
</html>
